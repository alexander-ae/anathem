[package]
name = "anathem"
version = "0.8.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Local memory for coding agents: one binary, one SQLite file, BM25 plus an optional static-embedding vector layer, and an MCP server."
repository = "https://gitlab.com/__alexander__/anathem"
readme = "README.md"
homepage = "https://gitlab.com/__alexander__/anathem"
# Five is the ceiling crates.io allows, so these are the words someone would
# actually type looking for this and not a description in pieces.
keywords = ["memory", "mcp", "agent", "sqlite", "bm25"]
categories = ["command-line-utilities", "database", "text-processing"]
# `graft/` is a context index for agents working ON this repository, useless
# to anyone depending on it, and `.claude/` holds worktrees. `docs/` stays in:
# the README links into it, and a published crate whose own links 404 is
# worse than 150 KB of markdown.
exclude = ["graft/", ".claude/"]

[lib]
name = "anathem"
path = "src/lib.rs"

[[bin]]
name = "mem"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
# Snowball for English and Spanish. Pure Rust, no C boundary, and the
# only reason a stemmer is possible without a custom FTS5 tokenizer.
rust-stemmers = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `mem edit` needs a temporary nobody else can guess or pre-create; see the
# comment at its call site in `main.rs`.
tempfile = "3"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Only to put `SIGPIPE` back to its default handler in `main`; Rust
# ignores it, which turns `mem ... | head` into a panic. See the comment
# on `die_on_closed_pipe`.
# `tests/broken_pipe_test.rs` builds the closed pipe it hands the child.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_yaml = "0.9.34"
tempfile = "3"
