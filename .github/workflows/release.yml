# Compila los binarios de macOS y los deja como artefactos.
#
# anathem vive en GitLab; esto es lo único que quedó acá, y por un motivo
# concreto: compilar para macOS exige hardware Apple —cruzar desde Linux
# necesitaría el SDK de Apple, cuya licencia lo limita a máquinas Apple— y los
# runners macOS de GitLab son solo Premium y Ultimate. GitHub los da gratis
# para repositorios públicos... y este es privado, así que corre contra la
# cuota de minutos; una release son unos pocos minutos de macOS al mes.
#
# No publica nada: deja los archivos como artefactos y `scripts/publicar-mac.sh`
# los baja y los sube a la release de GitLab. Se hace así a propósito, para que
# no haya un token de GitLab guardado del lado de GitHub.

name: binarios de macOS

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta que se está publicando, por ejemplo v0.1.0'
        required: true

jobs:
  construir:
    name: ${{ matrix.nombre }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: macos-arm64
            objetivo: aarch64-apple-darwin
          # El Mac Intel se compila cruzado desde Apple Silicon: `macos-13` se
          # retiró en diciembre de 2025 y un job que lo pida queda en cola para
          # siempre. El SDK de Apple apunta a las dos arquitecturas desde
          # cualquiera de las dos. Lo que se pierde es correr el binario para
          # comprobarlo, porque el runner no puede ejecutar x86_64.
          - nombre: macos-x86_64
            objetivo: x86_64-apple-darwin
            cruzado: true

    steps:
      - uses: actions/checkout@v4

      - name: Instalar el objetivo de Rust
        run: rustup target add ${{ matrix.objetivo }}

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.objetivo }}

      - name: Comprobar que el binario corre y sabe su commit
        if: '!matrix.cruzado'
        run: ./target/${{ matrix.objetivo }}/release/mem --version

      - name: Comprobar que el binario es de la arquitectura pedida
        if: matrix.cruzado
        run: |
          set -eu
          file "target/${{ matrix.objetivo }}/release/mem"
          file "target/${{ matrix.objetivo }}/release/mem" | grep -q x86_64

      - name: Empaquetar
        run: |
          set -eu
          nombre="mem-${{ matrix.nombre }}"
          tar -C "target/${{ matrix.objetivo }}/release" -czf "$nombre.tar.gz" mem
          shasum -a 256 "$nombre.tar.gz" > "$nombre.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mem-${{ matrix.nombre }}
          path: |
            mem-${{ matrix.nombre }}.tar.gz
            mem-${{ matrix.nombre }}.tar.gz.sha256
          retention-days: 7
