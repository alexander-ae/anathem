# Builds every published binary and leaves them as artifacts.
#
# anathem lives on GitLab. This repository is a mirror that exists to compile:
# GitHub Actions is free and unlimited for public repositories on all three
# operating systems, while GitLab's shared-runner quota is 400 minutes a month
# and one release used to spend 28 of them on Windows alone — and macOS was
# never available there at all, since those runners are Premium and Ultimate
# only.
#
# It publishes nothing. The files are left as artifacts and
# `scripts/publish-binaries.sh`, run from the maintainer's machine, downloads
# them and uploads them to the GitLab release. That is deliberate: no GitLab
# credential is stored on GitHub's side, and every publication is made by a
# person knowingly.
#
# WHAT WENT WRONG BEFORE, and what guards it now. This workflow used to check
# out with no `ref`, which meant it built whatever sat on the mirror's default
# branch while the tag it was handed went unused. Nothing ever synced the
# mirror, so the macOS binaries published as v0.2.1 and v0.2.2 were both built
# from v0.2.0's code — and nobody could tell, because a macOS binary does not
# run on the Linux machine that published it. Two things stop that now: the
# checkout takes the tag, and every job refuses to upload a binary that does
# not report the version it was asked to build.
name: binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag being published, for example v0.3.0'
        required: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # `macos-latest`, not a pinned image. Pinning has now broken this
          # twice: `macos-13` was retired in December 2025, and `macos-14`
          # went the same way — v0.4.0's first attempt died on "the
          # configuration 'macos-14-arm64-us-default' is not supported", with
          # Linux and Windows green beside it. A retired label does not warn;
          # it fails the release at the only moment anybody runs this, and it
          # fails the two platforms that cannot be built anywhere else. The
          # floating label can move the image underneath us, which is the
          # smaller problem for a build whose dependencies are Rust and
          # Apple's SDK.
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          # The Intel Mac is cross-compiled from Apple Silicon: Apple's SDK
          # targets both architectures from either one. What is lost is
          # running the binary to check it, because the runner cannot execute
          # x86_64 — so the architecture is checked with `file` instead, and
          # the version is read out of the binary rather than asked for.
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar
            cross: true

    steps:
      # The tag, and not the default branch. This is the line whose absence
      # shipped v0.2.0's code as v0.2.2 on macOS.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # `build.rs` reads the commit with `git rev-parse HEAD`, and a
          # shallow checkout is enough for that. The step below needs the tag
          # object as well, which it fetches itself.
          fetch-depth: 1

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Two checks, and the first is the one that matters. Reading a version
      # out of a binary only works when the binary can be run or its strings
      # can be found, and neither is guaranteed; comparing the checkout
      # against the tag is exact on every platform and is the thing that
      # actually went wrong before.
      - name: Check the checkout really is the tag
        shell: bash
        run: |
          set -eu
          git fetch --depth 1 origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}" 2>/dev/null || true
          esperado="$(git rev-list -n 1 "${{ inputs.tag }}")"
          obtenido="$(git rev-parse HEAD)"
          echo "tag ${{ inputs.tag }} is $esperado, checkout is $obtenido"
          if [ "$esperado" != "$obtenido" ]; then
            echo "::error::checked out $obtenido while publishing ${{ inputs.tag }} ($esperado)" >&2
            exit 1
          fi

      - name: Check the binary says the version that was asked for
        if: '!matrix.cross'
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/mem"
          [ -f "$bin" ] || bin="$bin.exe"
          esperado="${{ inputs.tag }}"
          esperado="${esperado#v}"
          obtenido="$("$bin" --version | awk '{print $2}')"
          echo "asked for $esperado, built $obtenido"
          if [ "$esperado" != "$obtenido" ]; then
            echo "::error::built $obtenido while publishing $esperado" >&2
            exit 1
          fi

      - name: Check the architecture, when it cannot be run
        if: matrix.cross
        run: |
          set -eu
          file "target/${{ matrix.target }}/release/mem"
          file "target/${{ matrix.target }}/release/mem" | grep -q x86_64

      - name: Pack it
        shell: bash
        run: |
          set -eu
          cd "target/${{ matrix.target }}/release"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "mem-${{ matrix.name }}.zip" mem.exe
          else
            tar -czf "mem-${{ matrix.name }}.tar.gz" mem
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mem-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/mem-${{ matrix.name }}.tar.gz
            target/${{ matrix.target }}/release/mem-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 7

  # The suite, on the two platforms where paths and processes behave
  # differently. Free here, where it used to be 28 minutes of a 400-minute
  # monthly quota on GitLab.
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: cargo test --locked
