# Corre la batería en macOS, que es lo único que GitLab no puede darnos.
#
# Linux y Windows se prueban en el CI de GitLab, donde vive el proyecto. macOS
# necesita hardware Apple y los runners macOS de GitLab son solo Premium y
# Ultimate, así que esta es la única forma de que la frase "probado en macOS"
# sea cierta y no una suposición.
#
# Se dispara a mano y no en cada push, porque este repositorio es privado y los
# minutos de macOS se cobran. Conviene correrlo antes de etiquetar una release
# y después de cualquier cambio que toque rutas, archivos o procesos.

name: tests en macOS

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cachear las dependencias compiladas
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-14-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-14-cargo-

      - name: Tests
        run: cargo test --locked

      - name: El binario corre y sabe su commit
        run: cargo run --locked --quiet -- --version

      - name: Recorrido mínimo sobre una base recién creada
        run: |
          set -eu
          cargo run --locked --quiet -- --db prueba.db init
          cargo run --locked --quiet -- --db prueba.db save "una nota de prueba"
          cargo run --locked --quiet -- --db prueba.db search "prueba"
          cargo run --locked --quiet -- --db prueba.db doctor
