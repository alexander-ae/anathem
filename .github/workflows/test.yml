# The suite, on every push, on the three platforms anathem ships for.
#
# It runs here and not on GitLab, where the project lives, for one reason:
# GitLab's Free plan gives 400 shared-runner minutes a month and this project
# ran out of them. GitHub Actions is free and unlimited for public
# repositories on all three operating systems, and this mirror is public with
# exactly that purpose.
#
# Windows and macOS earn their place rather than padding the matrix. Both have
# bitten this codebase in ways Linux could not show: `rename` over a
# memory-mapped file behaves differently on Windows, `$HOME` and `%USERPROFILE%`
# disagree about where the database goes, and a memory whose frontmatter used
# CRLF was silently dropped on import — found by the Windows job, not by
# review.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: windows
            runner: windows-latest
          - name: macos
            # `macos-latest` and not a pinned image, for the third time.
            # `release.yml` learned this on 2026-11-06 — "the macOS runner
            # label floats, because pinning it has broken twice" — and the
            # fix was applied there and not here. A pinned label that GitHub
            # retires does not fail the job: it never schedules it, so the
            # job is cancelled with zero steps and the run reports
            # `cancelled` rather than red. macOS went untested for at least a
            # day and nothing said so.
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build and test
        run: cargo test --locked

      # `build.rs` reads the commit with git, and a binary that cannot say
      # which build it is makes every later report ambiguous.
      - name: The binary knows what it is
        run: cargo run --locked --quiet -- --version

  audit:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Without this, the next vulnerability in a dependency goes unnoticed.
      # It is not a gate on merging: an advisory with no fix available should
      # be read, not used to block work.
      - name: Audit
        run: cargo audit
        continue-on-error: true
