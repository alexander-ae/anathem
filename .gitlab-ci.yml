# CI de anathem: corre la batería y publica los binarios de cada etiqueta.
#
# Cubre Linux y Windows, que es lo que los runners del plan Free alcanzan.
# El binario de macOS no sale de acá: los runners macOS de GitLab son solo
# Premium y Ultimate, y cruzar desde Linux necesitaría el SDK de Apple, cuya
# licencia lo limita a hardware Apple. Se construye aparte y se sube a la
# misma release; ver scripts/publicar-mac.sh.
#
# Si los pipelines no arrancan, es que la cuenta todavía no verificó una
# tarjeta: GitLab lo exige para usar sus runners compartidos en el plan Free.
# Sin eso, scripts/publicar.sh hace lo mismo desde tu máquina.

stages:
  - probar
  - construir
  - publicar

variables:
  CARGO_TERM_COLOR: always
  # El registro de paquetes genéricos exige una versión X.Y.Z, sin la `v`.
  PAQUETE: anathem

.cache_cargo: &cache_cargo
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/

probar:linux:
  stage: probar
  image: rust:1-bookworm
  <<: *cache_cargo
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  script:
    - cargo test --locked
    - cargo run --locked --quiet -- --version
    # Un recorrido de verdad: la batería usa bases temporales y no prueba el
    # camino que hace alguien al instalar.
    - cargo run --locked --quiet -- --db prueba.db init
    - cargo run --locked --quiet -- --db prueba.db save "una nota de prueba"
    - cargo run --locked --quiet -- --db prueba.db search "prueba"
    - cargo run --locked --quiet -- --db prueba.db doctor

# Avisos de seguridad de las dependencias (hallazgo M-4).
#
# No había ninguno: el árbol se enteraba de una vulnerabilidad cuando alguien
# la leía en otro lado. `cargo audit` compara Cargo.lock contra la base de
# RustSec, que es exactamente el trabajo que nadie va a hacer a mano.
#
# No bloquea: el aviso suele llegar antes que el arreglo —una dependencia
# transitiva sin versión parchada todavía— y dejar la publicación detenida
# por algo que no se puede arreglar ese día entrena a ignorar el rojo. Falla
# visible y no fatal, que es lo que un proyecto de una persona puede sostener.
auditar:dependencias:
  stage: probar
  needs: []
  image: rust:1-bookworm
  allow_failure: true
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    # Una clave sola para todas las ramas, al revés que los demás jobs. Lo
    # único que guarda es el binario de cargo-audit, que no depende de la
    # rama ni del código: con `$CI_COMMIT_REF_SLUG` cada rama nueva arrancaba
    # con caché fría y volvía a compilarlo, que es exactamente lo que la
    # guarda de `before_script` quiere evitar.
    key: auditar-cargo-audit
    paths:
      - .cargo/bin/
  before_script:
    # `cargo install` compila cargo-audit desde fuente: varios minutos, y se
    # pagarían en cada corrida. El binario queda en `$CARGO_HOME/bin`, que
    # este job ya cachea, así que solo se compila la primera vez y cuando la
    # caché se pierde. Sin esta guarda, el job de seguridad terminaba siendo
    # de los más caros del pipeline, que es justo lo que no queremos de algo
    # pensado para correr siempre.
    #
    # 0.22 o más: las versiones anteriores no parsean los avisos con CVSS 4.0
    # y se caen al cargar la base entera.
    - test -x "$CARGO_HOME/bin/cargo-audit" || cargo install cargo-audit --locked --version "^0.22"
  script:
    - cargo audit --deny warnings

probar:windows:
  stage: probar
  tags:
    - saas-windows-medium-amd64
  <<: *cache_cargo
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  before_script:
    # El runner de Windows no trae Rust. Chocolatey sí, y `rust-ms` es el
    # toolchain con MSVC, que es el que usa el binario publicado.
    - choco install rust-ms -y --no-progress
    - $env:Path = "C:\Program Files\Rust stable MSVC 1.*\bin;$env:Path"
    - rustc --version
  script:
    - cargo test --locked
    - cargo run --locked --quiet -- --version
  allow_failure: true
  # No en cada push. Medido sobre los 24 pipelines que llegó a correr este
  # proyecto: este job solo se llevó el 79% de todo el tiempo de CI —unos 14
  # minutos por corrida, contra 2 del de Linux— y es `allow_failure`, así que
  # nunca frenó nada. Falló 3 de 24 veces sin consecuencia alguna. Pagar eso
  # en cada push agotó la cuota mensual en dos días.
  #
  # Donde sí tiene que correr es antes de una etiqueta, que es cuando "probado
  # en Windows" pasa a ser una afirmación sobre algo que la gente se baja.
  # Fuera de ahí queda manual: está a un clic cuando se toca algo que lo
  # merece —rutas, archivos, procesos— y no cuesta nada cuando no.
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

construir:linux:
  stage: construir
  # Sin esperar a la etapa de pruebas: en el runner de Windows la batería
  # tarda media hora, y dejaba la publicación entera detrás de ella.
  needs: []
  image: rust:1-bookworm
  <<: *cache_cargo
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  script:
    - cargo build --release --locked
    - ./target/release/mem --version
    - tar -C target/release -czf mem-linux-x86_64.tar.gz mem
    - sha256sum mem-linux-x86_64.tar.gz > mem-linux-x86_64.tar.gz.sha256
  artifacts:
    paths:
      - mem-linux-x86_64.tar.gz
      - mem-linux-x86_64.tar.gz.sha256
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

construir:windows:
  stage: construir
  needs: []
  # Que Windows no bloquee la release: el job que publica saltea el archivo
  # que falte y lo dice.
  allow_failure: true
  tags:
    - saas-windows-medium-amd64
  <<: *cache_cargo
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  before_script:
    - choco install rust-ms -y --no-progress
    - $env:Path = "C:\Program Files\Rust stable MSVC 1.*\bin;$env:Path"
  script:
    - cargo build --release --locked
    - Compress-Archive -Path target\release\mem.exe -DestinationPath mem-windows-x86_64.zip
    - (Get-FileHash mem-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() + "  mem-windows-x86_64.zip" | Out-File -Encoding ascii mem-windows-x86_64.zip.sha256
  artifacts:
    paths:
      - mem-windows-x86_64.zip
      - mem-windows-x86_64.zip.sha256
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

publicar:
  stage: publicar
  needs:
    - job: construir:linux
      artifacts: true
    - job: construir:windows
      artifacts: true
  # Esta imagen trae release-cli, que es lo que la palabra `release` necesita
  # para crear la release; una imagen cualquiera falla ahí.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    # La imagen de release-cli no trae curl, y sin esto el job falla recién al
    # final, después de haber compilado las cuatro plataformas.
    - command -v curl >/dev/null || apk add --no-cache curl
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for f in mem-linux-x86_64.tar.gz mem-linux-x86_64.tar.gz.sha256 \
               mem-windows-x86_64.zip mem-windows-x86_64.zip.sha256; do
        [ -f "$f" ] || { echo "falta $f, lo salteo"; continue; }
        echo "subiendo $f"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PAQUETE}/${VERSION}/${f}"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Ver el README para instalar. Los binarios y el paquete de vocabulario cuelgan de acá.'
    assets:
      # `filepath` no es decoración: sin él, el enlace apunta directo al
      # registro de paquetes y la URL `/-/releases/<tag>/downloads/<archivo>`
      # —la que usa el instalador— devuelve 404 aunque el archivo figure en la
      # release. Pasó en la v0.2.0 y no se nota hasta que alguien instala.
      links:
        - name: mem-linux-x86_64.tar.gz
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/anathem/${CI_COMMIT_TAG}/mem-linux-x86_64.tar.gz'
          filepath: '/mem-linux-x86_64.tar.gz'
        - name: mem-linux-x86_64.tar.gz.sha256
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/anathem/${CI_COMMIT_TAG}/mem-linux-x86_64.tar.gz.sha256'
          filepath: '/mem-linux-x86_64.tar.gz.sha256'
        - name: mem-windows-x86_64.zip
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/anathem/${CI_COMMIT_TAG}/mem-windows-x86_64.zip'
          filepath: '/mem-windows-x86_64.zip'
        - name: mem-windows-x86_64.zip.sha256
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/anathem/${CI_COMMIT_TAG}/mem-windows-x86_64.zip.sha256'
          filepath: '/mem-windows-x86_64.zip.sha256'
